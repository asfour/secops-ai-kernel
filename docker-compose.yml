version: "3.8"

services:
  kernel-core:
    image: golang:1.25-bookworm
    container_name: secops-kernel-core
    volumes:
      - .:/workspace
    working_dir: /workspace
    security_opt:
      - apparmor:unconfined
    cap_add:
      - SYS_ADMIN # Enforces necessary privileges to inject Ring-0 eBPF telemetry hooks
    devices:
      - "/dev/kvm:/dev/kvm" # Safely maps physical hardware virtualization pathways
    ports:
      - "50051:50051"
    environment:
      - GOPATH=/go
    command: >
      bash -c "apt-get update && apt-get install -y protobuf-compiler clang llvm libelf-dev libbpf-dev z3 gcc-multilib &&
      export PATH=$$PATH:$$(go env GOPATH)/bin &&
      ./setup.sh &&
      go test -v ./pkg/sandbox/firecracker/... &&
      go run pkg/agent/remediation_worker.go"
    networks:
      - secops-m2m-mesh

networks:
  secops-m2m-mesh:
    driver: bridge
    ipam:
      config:
        - subnet: 10.0.99.0/24
