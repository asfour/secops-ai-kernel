site_name: SecOps Kernel OS
site_description: An Immutable Autonomous Security Operating System Engine for AI Agents.
site_url: https://github.io

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: cyan
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: indigo
  features:
    - navigation.tabs
    - navigation.sections
    - code.copy

plugins:
  - search

nav:
  - Home: index.md
  - Architecture: architecture.md
  - SDK Reference: sdk.md
