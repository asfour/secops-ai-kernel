name: "SecOps Kernel Operations Notification Bridge"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_run:
    workflows: ["SecOps Kernel Machine Attestation CI"]
    types: [completed]

jobs:
  dispatch-slack-payload:
    runs-on: ubuntu-latest
    steps:
      - name: "Post Status Packet via Native Curl Stream"
        if: always()
        run: |
          # Verify that the operational webhook token is configured on the host
          if [ -z "\${{ secrets.SLACK_WEBHOOK_URL }}" ]; then
            echo "Slack notification webhook is unassigned. Bypassing stream pipeline."
            exit 0
          fi

          # Stream a natively escaped, single-line valid JSON object directly to the API
          curl -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"🚨 *SecOps Kernel Operations Alert*\\n*Repository:* \${{ github.repository }}\\n*Workflow Match:* \`${{ github.workflow }}\`\\n*Execution Status:* **\${{ job.status }}**\"}" \
            "\${{ secrets.SLACK_WEBHOOK_URL }}"
