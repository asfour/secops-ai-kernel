name: "SecOps Kernel Operations Notification Bridge"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_run:
    workflows: ["SecOps Kernel Machine Attestation CI"]
    types: [completed]

jobs:
  dispatch-slack-payload:
    runs-on: ubuntu-latest
    steps:
      - name: "Stream Channel Frame Payload"
        if: always()
        uses: slackapi/slack-github-action@v2.0.0
        with:
          webhook: \${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: webhook-trigger
          # Using native structural configuration variables eliminates JSON string escaping bugs completely
          payload: |
            text: "🚨 SecOps Kernel Stream Update: \${{ github.repository }}"
            blocks:
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "🛡️ *SecOps Kernel Core Execution Notification Block*\n*Repository:* \${{ github.repository }}\n*Commit:* `${{ github.sha }}`\n*Status:* *\${{ job.status }}*"
              - type: "context"
                elements:
                  - type: "mrkdwn"
                    text: "Machine-to-Machine Lifecycle Event Monitored out-of-band."
