name: "SecOps Kernel Operations Notification Bridge"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_run:
    workflows: ["SecOps Kernel Machine Attestation CI"]
    types: [completed]

jobs:
  dispatch-slack-payload:
    runs-on: ubuntu-latest
    steps:
      - name: "Stream Channel Frame Payload"
        if: always()
        uses: slackapi/slack-github-action@v2.0.0
        with:
          webhook: \${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: webhook-trigger
          # Utilizing clean inline escaping guarantees valid JSON parsing regardless of multi-line context
          payload: "{\"text\":\"🚨 *SecOps Kernel Stream Update*\\n*Repository:* \${{ github.repository }}\\n*Commit:* `${{ github.sha }}`\"}"
