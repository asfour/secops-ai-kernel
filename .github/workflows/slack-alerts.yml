name: "SecOps Kernel Operations Notification Bridge"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_run:
    workflows: ["SecOps Kernel Machine Attestation CI"]
    types: [completed]

jobs:
  dispatch-slack-payload:
    runs-on: ubuntu-latest
    steps:
      - name: "Post Status Packet via Native Curl Stream"
        if: always()
        # Clean, unescaped expressions evaluate perfectly inside the GitHub runner engine context
        env:
          WEBHOOK_URL: \${{ secrets.SLACK_WEBHOOK_URL }}
          REPO_NAME: \${{ github.repository }}
          WORKFLOW_NAME: \${{ github.workflow }}
          JOB_STATUS: \${{ job.status }}
        run: |
          # Flat shell code evaluates without data structure pollution
          if [ -z "\$WEBHOOK_URL" ]; then
            echo "⚠️ Slack Operational Token is empty or unconfigured inside GitHub Secrets. Skipping network connection pipeline."
            exit 0
          fi

          curl -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"🚨 *SecOps Kernel Operations Alert*\\n*Repository:* \$REPO_NAME\\n*Workflow:* \`$WORKFLOW_NAME\`\\n*Execution Status:* **\$JOB_STATUS**\"}" \
            "\$WEBHOOK_URL"
