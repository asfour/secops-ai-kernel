name: "SecOps Kernel Artifact Release"

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release-artifacts:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Codebase"
        uses: actions/checkout@v4

      - name: "Install System Toolchains"
        run: |
          sudo apt-get update -y
          # Added libbpf-dev explicitly to ensure bpf/bpf_helpers.h exists on host disk
          sudo apt-get install -y clang llvm libelf-dev libbpf-dev protobuf-compiler z3

      - name: "Configure Go Runtime Environment"
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: "Compile gRPC Stubs and Bindings"
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
          export GOPATH=$(go env GOPATH)
          export PATH=$PATH:$GOPATH/bin
          protoc -I=pkg/api/v2/ \
            --go_out=paths=source_relative:pkg/api/v2/ \
            --go-grpc_out=paths=source_relative:pkg/api/v2/ \
            pkg/api/v2/secops_kernel.proto

      - name: "Compile Ring-0 eBPF Bytecode"
        run: |
          # Added -I/usr/include to map libbpf-dev header libraries correctly
          clang -O2 -target bpf \
            -I/usr/include \
            -I/usr/include/x86_64-linux-gnu \
            -c pkg/kernel/ebpf/monitor.c -o pkg/kernel/ebpf/monitor.o

      - name: "Compile Native secopsctl CLI Utility"
        run: |
          mkdir -p release-bundle
          go build -ldflags="-s -w" -o release-bundle/secopsctl cmd/secopsctl/main.go

      - name: "Bundle Target Release Assets"
        run: |
          cp pkg/kernel/ebpf/monitor.o release-bundle/
          cp configs/secops-kernel.yaml release-bundle/
          tar -czvf secops-kernel-core-assets.tar.gz -C release-bundle .

      - name: "Publish Assets to Immutable GitHub Release"
        uses: softprops/action-gh-release@v2
        with:
          files: secops-kernel-core-assets.tar.gz
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: \${{ secrets.GITHUB_TOKEN }}
